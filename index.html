<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>NYC Basement Locator</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Sticky Header for quick access while scrolling -->
  <div class="sticky-header">
    <header>
      <h1>📦 Basement Locator</h1>
    </header>

    <div class="search-container">
      <input 
        type="text" 
        id="searchInput" 
        class="search-box" 
        placeholder="🔍 Name, SKU, Barcode, or Bin..." 
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        inputmode="search"
      />
    </div>

    <!-- Quick Filter Pills -->
    <div class="filter-bar">
      <button class="filter-pill active" data-filter="all">All Items</button>
      <button class="filter-pill" data-filter="in-stock">In Stock</button>
      <button class="filter-pill" data-filter="out-of-stock">Out of Stock</button>
      <button class="filter-pill" data-filter="discontinued">Discontinued</button>
    </div>
  </div>

  <main>
    <div id="resultsInfo" class="results-info"></div>
    
    <div id="itemList" class="item-grid">
      <!-- Loading spinner -->
      <div class="loader-container">
        <div class="loader"></div>
        <p>Connecting to database...</p>
      </div>
    </div>

    <div id="loadMoreContainer" style="text-align: center; margin: 30px 0; display: none;">
      <button id="loadMoreBtn" class="btn-primary">Load More Items</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
