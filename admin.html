<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Basement Locator</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Admin Specific Styles */
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .login-container input {
      width: 100%; padding: 12px; margin-bottom: 15px;
      border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-dark); color: white; box-sizing: border-box;
    }
    .admin-dashboard { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    
    /* Data Table Styles */
    .table-responsive { overflow-x: auto; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th, td { padding: 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: #0f172a; font-weight: bold; color: var(--text-muted); }
    tr:hover { background: #2a3a52; }
    
    /* Modal Styles */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;
    }
    .modal-content {
      background: var(--card-bg); padding: 24px; border-radius: 12px;
      width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto;
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 0.8rem; color: var(--text-muted); font-weight: bold; }
    .form-group input, .form-group select { 
      padding: 10px; border-radius: 6px; border: 1px solid var(--border); 
      background: var(--bg-dark); color: white; 
    }
    .btn-danger { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-container">
    <h2 style="text-align: center; margin-top: 0;">🔒 Admin Login</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit" class="btn-primary" style="width: 100%;">Sign In</button>
    </form>
    <p id="loginError" style="color: #ef4444; text-align: center; margin-top: 10px; font-size: 0.9rem;"></p>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="dashboard" class="admin-dashboard">
    <div class="top-bar">
      <h1>📦 Admin Dashboard</h1>
      <div>
        <button id="addItemBtn" class="btn-primary" style="margin-right: 10px;">+ Add New Item</button>
        <button id="logoutBtn" class="filter-pill" style="border-color: #ef4444; color: #ef4444;">Logout</button>
      </div>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>SKU</th>
            <th>Description</th>
            <th>Stock</th>
            <th>Status</th>
            <th>Bin/Location</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="adminTableBody">
          <tr><td colspan="6" style="text-align: center;">Loading data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ADD/EDIT MODAL -->
  <div id="itemModal" class="modal-overlay">
    <div class="modal-content">
      <h2 id="modalTitle" style="margin-top: 0;">Add New Item</h2>
      <form id="itemForm">
        <input type="hidden" id="itemId" />
        
        <div class="form-grid">
          <div class="form-group">
            <label>SKU * (Required)</label>
            <input type="text" id="sku" required />
          </div>
          <div class="form-group">
            <label>Description * (Required)</label>
            <input type="text" id="description" required />
          </div>
          <div class="form-group">
            <label>Barcode</label>
            <input type="text" id="barcode" />
          </div>
          <div class="form-group">
            <label>Category</label>
            <input type="text" id="category" />
          </div>
          <div class="form-group">
            <label>Stock (Yes/No)</label>
            <select id="stock">
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>
          <div class="form-group">
            <label>Status</label>
            <input type="text" id="status" placeholder="e.g. On Sale" />
          </div>
          <div class="form-group">
            <label>Area</label>
            <input type="text" id="area" />
          </div>
          <div class="form-group">
            <label>Shelf</label>
            <input type="text" id="shelf" />
          </div>
          <div class="form-group">
            <label>Bin</label>
            <input type="text" id="bin" />
          </div>
          <div class="form-group">
            <label>Image URL</label>
            <input type="url" id="image_url" />
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" id="cancelModalBtn" class="filter-pill">Cancel</button>
          <button type="submit" class="btn-primary" id="saveItemBtn">Save Item</button>
        </div>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
